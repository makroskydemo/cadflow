name: Publish MAKROSKY CadFlow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'makroskydemo/cadflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Build CadFlow static application
        run: npm run build
      - name: Verify publication files
        run: npm run verify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live GitHub Pages configuration
        env:
          CADFLOW_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.CADFLOW_PAGES_URL;
          if (!base?.startsWith('https://makroskydemo.github.io/cadflow/')) throw Error('Unexpected Pages URL: ' + base);
          const configUrl = new URL('./plmr-public-config.json', base);
          let lastError;
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              const response = await fetch(configUrl, {cache: 'no-store'});
              if (!response.ok) throw Error('Pages public configuration HTTP ' + response.status);
              const c = await response.json();
              if (c.supabaseUrl !== 'https://rqstvpmqgkdghrbokbzn.supabase.co' ||
                  !/^sb_publishable_[A-Za-z0-9_-]{16,}$/.test(c.supabasePublishableKey)) {
                throw Error('Pages configuration does not match MAKROSKY public credentials');
              }
              const entry = await fetch(base, {cache: 'no-store'});
              if (!entry.ok || !(await entry.text()).includes('MAKROSKY CadFlow')) throw Error('Pages HTML entry unavailable');
              console.log('LIVE PAGES SMOKE TEST PASSED:', base);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.warn('Pages readiness check ' + (attempt + 1) + '/10:', error.message);
              if (attempt < 9) await new Promise(resolve => setTimeout(resolve, 4000));
            }
          }
          throw lastError;
          NODE
